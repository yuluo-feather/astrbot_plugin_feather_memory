name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q core adapters app main.py
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy .
      - name: Test
        run: python -m pytest
