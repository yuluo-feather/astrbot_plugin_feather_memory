; mypy settings for feather_memory. ASCII only: mypy reads this file with the
; system locale codec (GBK on a Chinese Windows box).
[mypy]
python_version = 3.12
files = .
ignore_missing_imports = True
show_error_codes = True
pretty = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
