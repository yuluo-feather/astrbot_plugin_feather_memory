name: feather_memory
display_name: 羽忆
desc: 羽忆：为星羽塔罗记住偏好与近期主题（需要星羽塔罗 0.11+ 的共享文件契约）
short_desc: 为星羽塔罗记住偏好与近期主题
help: |
  [羽忆] 或 [羽忆 查看] 查看主动保存与近期主题（私聊）
  [羽忆 导出] 把本人的记忆、近期主题与开关状态导出为 JSON 文件（私聊）
  [羽忆 记住 内容] 保存偏好 / 背景 / 目标（私聊；自动开启总开关）
  [羽忆 修改 id 内容] 修改一条主动保存（保留 id，可选前缀改分类）
  [羽忆 忘记 id] 删除一条主动保存
  [羽忆 清空] 二次确认后删除已有数据（之后仍会继续记录）
  [羽忆 开启] 一次打开总开关、自动历史、主题记录（只写一次授权）
  [羽忆 开启 自动] 单项细调：允许把私聊普通占卜记入近期主题
  [羽忆 开启 主题] 单项细调：允许事件携带固定主题枚举
  [羽忆 关闭 自动] 单项关闭：只关自动历史
  [羽忆 关闭 主题] 单项关闭：只关主题记录
  [羽忆 关闭] 全关并停止记录：删除 context / 待处理事件，授权写墓碑
  [羽忆 状态] 查看租约、开关、授权、context 与最近消费
  注意：不摄入群聊、不摄入今日牌运、不保存原始问题；数据只在本机 plugin_data。
version: 0.1.0
author: 羽落
repo: https://github.com/yuluo-feather/astrbot_plugin_feather_memory
astrbot_version: ">=4.16,<5"
tags:
  - 记忆
  - 塔罗
  - 工具
